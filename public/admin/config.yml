              - { name: subtitle, label: Subtitle, widget: string }
              - { name: ctaPrimaryLabel, label: Primary CTA Label, widget: string }
              - { name: ctaPrimaryHref, label: Primary CTA Link, widget: string }
              - { name: ctaSecondaryLabel, label: Secondary CTA Label, widget: string }
              - { name: ctaSecondaryHref, label: Secondary CTA Link, widget: string }

      - name: media
        label: Media Page
        file: src/data/pages/media.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
              - { name: title, label: Page Title, widget: string }
              - { name: description, label: Meta Description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
              - { name: intro, label: Intro, widget: text }
          - { name: photosLabel, label: Photos Count Label, widget: string }
          - name: detail
            label: Gallery Detail Labels
            widget: object
            fields:
              - { name: backLabel, label: Back Label, widget: string }
              - { name: photosLabel, label: Photos Label, widget: string }
              - { name: openPhotoLabel, label: Open Photo Label, widget: string }

      - name: blog
        label: Blog Page
        file: src/data/pages/blog.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
              - { name: title, label: Page Title, widget: string }
              - { name: description, label: Meta Description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
              - { name: intro, label: Intro, widget: text }
          - { name: readLabel, label: "Read Post Label", widget: string }
          - name: detail
            label: Post Detail
            widget: object
            fields:
              - { name: backLabel, label: Back Label, widget: string }
              - { name: ctaTitle, label: Bottom CTA Title, widget: string }
              - { name: ctaBody, label: Bottom CTA Body, widget: text }
              - { name: ctaLabel, label: Bottom CTA Label, widget: string }
              - { name: ctaHref, label: Bottom CTA Link, widget: string }

      - name: schedule
        label: Schedule Page
        file: src/data/pages/schedule.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
              - { name: title, label: Page Title, widget: string }
              - { name: description, label: Meta Description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
              - { name: intro, label: Intro, widget: text }
          - name: next
            label: Next Race Card
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: tbaNote, label: TBA Note, widget: string }
          - name: countdownLabels
            label: Countdown Labels
            widget: object
            fields:
              - { name: days, label: Days, widget: string }
              - { name: hours, label: Hours, widget: string }
              - { name: mins, label: Minutes, widget: string }
              - { name: secs, label: Seconds, widget: string }
          - name: upcoming
            label: Upcoming Heading
            widget: object
            fields:
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
          - name: past
            label: Past Events
            widget: object
            fields:
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
              - { name: completedLabel, label: "Completed badge text", widget: string }
              - { name: pendingResultLabel, label: "Text when a result isn't entered yet", widget: string }
              - name: headers
                label: Table Headers
                widget: object
                fields:
                  - { name: date, label: Date, widget: string }
                  - { name: event, label: Event, widget: string }
                  - { name: circuit, label: Circuit, widget: string }
                  - { name: series, label: Series, widget: string }
                  - { name: result, label: Result, widget: string }
              - { name: photosLabel, label: Photos Link Label, widget: string }

      - name: partnerships
        label: Partnerships Page
        file: src/data/pages/partnerships.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
              - { name: title, label: Page Title, widget: string }
              - { name: description, label: Meta Description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
