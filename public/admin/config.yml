        file: src/data/pages/contact.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
              - { name: title, label: Page Title, widget: string }
              - { name: description, label: Meta Description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: titlePrefix, label: Title Prefix, widget: string }
              - { name: titleAccent, label: Title Accent, widget: string }
              - { name: intro, label: Intro, widget: text }
          - name: emailCard
            label: Email Card
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: blurb, label: Blurb, widget: text }
          - name: socialsCard
            label: Socials Card
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - name: handles
                label: Handles
                widget: list
                field: { name: handle, label: Handle, widget: string }
          - name: partnershipCard
            label: Partnership Card
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: ctaLabel, label: CTA Label, widget: string }
              - { name: ctaHref, label: CTA Link, widget: string }
          - name: form
            label: Contact Form
            widget: object
            fields:
              - { name: successMessage, label: Success Message, widget: string }
              - { name: nameLabel, label: Name Label, widget: string }
              - { name: namePlaceholder, label: Name Placeholder, widget: string }
              - { name: emailLabel, label: Email Label, widget: string }
              - { name: emailPlaceholder, label: Email Placeholder, widget: string }
              - { name: topicLabel, label: Topic Label, widget: string }
              - name: topics
                label: Topic Options
                widget: list
                field: { name: topic, label: Topic, widget: string }
              - { name: messageLabel, label: Message Label, widget: string }
              - { name: messagePlaceholder, label: Message Placeholder, widget: string }
              - { name: submitLabel, label: Submit Label, widget: string }

      - name: notfound
        label: 404 Page
        file: src/data/pages/notfound.json
        fields:
          - name: meta
            label: SEO
            widget: object
            fields:
