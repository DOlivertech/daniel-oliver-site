          - name: offers
            label: What Partners Get
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - name: items
                label: Offer Cards
                widget: list
                fields:
                  - { name: icon, label: "Icon (SVG path — advanced, leave as-is unless you know SVG)", widget: string, hint: "The 'd' attribute of an SVG <path>. Editing this changes the little card icon." }
