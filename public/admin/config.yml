                  - { name: body, label: Body, widget: text }
          - name: limitBreak
            label: Project Limit Break Section
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: image, label: Image, widget: image }
              - { name: imageAlt, label: Image Alt Text, widget: string }
          - name: partnersSection
            label: Current Partners
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
          - name: deck
            label: Partnership Deck CTA
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: url, label: "Deck link (Google Drive / PDF)", widget: string, required: false, hint: "Paste your Google Drive (or any) link to the deck. If filled, the button opens it in a new tab; if left blank, the button becomes a 'request by email' link instead." }
